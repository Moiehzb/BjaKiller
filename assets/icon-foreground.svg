<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d27a"/>
      <stop offset="45%" stop-color="#d4a94e"/>
      <stop offset="100%" stop-color="#a9781f"/>
    </linearGradient>
    <linearGradient id="parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e9cf"/>
      <stop offset="100%" stop-color="#dac9a0"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#f6e9c4"/>
      <stop offset="100%" stop-color="#cbb47f"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- CARTE (légèrement inclinée) — agrandie pour mieux remplir l'icône/splash -->
  <g transform="translate(512 512) scale(1.72) translate(-512 -512) rotate(-7 512 512)" filter="url(#soft)">
    <rect x="299" y="214" width="426" height="596" rx="36" fill="url(#parch)" stroke="url(#gold)" stroke-width="14"/>
    <rect x="325" y="240" width="374" height="544" rx="24" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.75"/>

    <!-- Coin haut-gauche : A + pique -->
    <g fill="url(#gold)">
      <path d="M356 300 L386 300 L371 262 Z M362 292 L380 292 L376 300 L366 300 Z" />
      <path d="M371 316 C367 326 351 332 351 344 C351 353 359 357 366 353 C365 359 363 362 359 366 L383 366 C379 362 377 359 376 353 C383 357 391 353 391 344 C391 332 375 326 371 316 Z"/>
    </g>
    <!-- Coin bas-droit : A + pique (miroir) -->
    <g fill="url(#gold)" transform="rotate(180 512 512)">
      <path d="M356 300 L386 300 L371 262 Z M362 292 L380 292 L376 300 L366 300 Z" />
      <path d="M371 316 C367 326 351 332 351 344 C351 353 359 357 366 353 C365 359 363 362 359 366 L383 366 C379 362 377 359 376 353 C383 357 391 353 391 344 C391 332 375 326 371 316 Z"/>
    </g>

    <!-- ŒIL DU COMPTEUR (héros) -->
    <path d="M366 512 Q512 398 658 512 Q512 626 366 512 Z" fill="none" stroke="url(#gold)" stroke-width="16"/>
    <circle cx="512" cy="512" r="70" fill="url(#iris)" stroke="url(#gold)" stroke-width="8"/>
    <!-- pupille = pique -->
    <path d="M512 470 C505 490 476 507 476 531 C476 544 488 550 499 544 C497 553 494 558 488 564 L536 564 C530 558 527 553 525 544 C536 550 548 544 548 531 C548 507 519 490 512 470 Z" fill="#17122b"/>
    <!-- éclat -->
    <circle cx="490" cy="492" r="10" fill="#fff" opacity="0.5"/>
  </g>
</svg>
